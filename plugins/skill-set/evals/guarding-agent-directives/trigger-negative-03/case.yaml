schema_version: "1.1"
name: guarding-agent-directives-trigger-negative-03
description: Should not select guarding-agent-directives for a near-miss request
tags:
  - guarding-agent-directives
  - trigger-negative
execution:
  prompt: "Explain the existing AGENTS.md to a new teammate without changing it."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 1
graders:
  - type: tool_used
    name: did-not-select-guarding-agent-directives
    tool: Skill
    input_match: "guarding-agent-directives"
    min: 0
    max: 0
    arm: both
