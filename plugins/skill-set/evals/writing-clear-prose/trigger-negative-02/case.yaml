schema_version: "1.1"
name: writing-clear-prose-trigger-negative-02
description: Should not select writing-clear-prose for a near-miss request
tags:
  - writing-clear-prose
  - trigger-negative
execution:
  prompt: "Write a conventional commit message for this diff."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: did-not-select-writing-clear-prose
    tool: Skill
    input_match: "writing-clear-prose"
    min: 0
    max: 0
    arm: both
  - type: llm
    name: appropriate-scope
    criteria: "Pass only if the response does not invoke or recommend writing-clear-prose and instead handles the request directly or identifies a more appropriate workflow without forcing it into this skill's scope."
    focus: last_message
