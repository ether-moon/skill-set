schema_version: "1.1"
name: zooming-out-on-code-trigger-positive-08
description: Should select zooming-out-on-code for a representative request
tags:
  - zooming-out-on-code
  - trigger-positive
execution:
  prompt: "Orient me to this top-level package and stop at its product role."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: selected-zooming-out-on-code
    tool: Skill
    input_match: "zooming-out-on-code"
    min: 1
  - type: llm
    name: workflow-outcome
    criteria: "Pass only if the response performs read-only orientation and reports exactly Responsibility, Callers, Dependencies, Siblings, and Unknowns without recommendations, edits, or architecture redesign."
    focus: last_message
