schema_version: "1.1"
name: zooming-out-on-code-trigger-negative-07
description: Should not select zooming-out-on-code for a near-miss request
tags:
  - zooming-out-on-code
  - trigger-negative
execution:
  prompt: "Grill the migration plan associated with this module."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: did-not-select-zooming-out-on-code
    tool: Skill
    input_match: "zooming-out-on-code"
    min: 0
    max: 0
    arm: both
  - type: llm
    name: appropriate-scope
    criteria: "Pass only if the response does not invoke or recommend zooming-out-on-code and instead handles the request directly or identifies a more appropriate workflow without forcing it into this skill's scope."
    focus: last_message
