schema_version: "1.1"
name: grilling-plans-trigger-negative-01
description: Should not select grilling-plans for a near-miss request
tags:
  - grilling-plans
  - trigger-negative
execution:
  prompt: "I have only a blank idea for a collaboration app; brainstorm possible products."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 1
graders:
  - type: tool_used
    name: did-not-select-grilling-plans
    tool: Skill
    input_match: "grilling-plans"
    min: 0
    max: 0
    arm: both
