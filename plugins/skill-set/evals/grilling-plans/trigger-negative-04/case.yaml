schema_version: "1.1"
name: grilling-plans-trigger-negative-04
description: Should not select grilling-plans for a near-miss request
tags:
  - grilling-plans
  - trigger-negative
execution:
  prompt: "Review the code diff for correctness and maintainability."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: did-not-select-grilling-plans
    tool: Skill
    input_match: "grilling-plans"
    min: 0
    max: 0
    arm: both
  - type: llm
    name: appropriate-scope
    criteria: "Pass only if the response does not invoke or recommend grilling-plans and instead handles the request directly or identifies a more appropriate workflow without forcing it into this skill's scope."
    focus: last_message
