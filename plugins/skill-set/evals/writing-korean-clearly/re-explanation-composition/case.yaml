schema_version: "1.1"
name: writing-korean-clearly-re-explanation-composition
description: Composes Korean prose preferences with a task-specific re-explanation skill
tags:
  - writing-korean-clearly
  - functional
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 1
graders:
  - type: tool_used
    name: selected-writing-korean-clearly
    tool: Skill
    input_match: writing-korean-clearly
    min: 1
  - type: tool_used
    name: selected-re-explain-clearly
    tool: Skill
    input_match: re-explain-clearly
    min: 1
