schema_version: "1.1"
name: writing-korean-clearly-trigger-negative-02
description: Should not select writing-korean-clearly for a near-miss request
tags:
  - writing-korean-clearly
  - trigger-negative
execution:
  prompt: "Translate this Korean paragraph into English."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 1
graders:
  - type: tool_used
    name: did-not-select-writing-korean-clearly
    tool: Skill
    input_match: "writing-korean-clearly"
    min: 0
    max: 0
    arm: both
