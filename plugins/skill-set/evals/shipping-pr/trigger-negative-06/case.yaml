schema_version: "1.1"
name: shipping-pr-trigger-negative-06
description: Should not select shipping-pr for a near-miss request
tags:
  - shipping-pr
  - trigger-negative
execution:
  prompt: "Review these external findings in review-only mode."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: did-not-select-shipping-pr
    tool: Skill
    input_match: "shipping-pr"
    min: 0
    max: 0
    arm: both
  - type: llm
    name: appropriate-scope
    criteria: "Pass only if the response does not invoke or recommend shipping-pr and instead handles the request directly or identifies a more appropriate workflow without forcing it into this skill's scope."
    focus: last_message
