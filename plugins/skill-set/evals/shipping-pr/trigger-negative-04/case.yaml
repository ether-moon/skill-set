schema_version: "1.1"
name: shipping-pr-trigger-negative-04
description: Should not select shipping-pr for a near-miss request
tags:
  - shipping-pr
  - trigger-negative
execution:
  prompt: "Rewrite the PR body so reviewers can understand the change."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 1
graders:
  - type: tool_used
    name: did-not-select-shipping-pr
    tool: Skill
    input_match: "shipping-pr"
    min: 0
    max: 0
    arm: both
