schema_version: "1.1"
name: shipping-pr-trigger-positive-01
description: Should select shipping-pr for a representative request
tags:
  - shipping-pr
  - trigger-positive
execution:
  prompt: "Ship this PR end to end and keep polling until checks and reviews are clean."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: selected-shipping-pr
    tool: Skill
    input_match: "shipping-pr"
    min: 1
  - type: llm
    name: workflow-outcome
    criteria: "Pass only if the response follows the bounded PR state machine, accounts for checks, reviews, pagination, head changes and no-progress convergence, and uses resolvers only within explicit mutation authority."
    focus: last_message
