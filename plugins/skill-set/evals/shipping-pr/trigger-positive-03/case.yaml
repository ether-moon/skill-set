schema_version: "1.1"
name: shipping-pr-trigger-positive-03
description: Should select shipping-pr for a representative request
tags:
  - shipping-pr
  - trigger-positive
execution:
  prompt: "Ship PR 42 end to end: keep polling, resolve every authorized blocker, resnapshot each new HEAD, and do not stop until the PR is clean or the shipping state machine reaches a terminal stop."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: selected-shipping-pr
    tool: Skill
    input_match: "shipping-pr"
    min: 1
  - type: llm
    name: workflow-outcome
    criteria: "Pass only if the response follows the bounded PR state machine, accounts for checks, reviews, pagination, head changes and no-progress convergence, and uses resolvers only within explicit mutation authority."
    focus: last_message
