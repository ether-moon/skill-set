schema_version: "1.1"
name: shipping-pr-behind-base-current-branch-publication
description: Publishes the current PR branch before resolving a conflict with the base branch
tags:
  - shipping-pr
  - functional
  - read-only
  - publication-boundary
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools:
    - Skill
    - Read
runs: 3
graders:
  - type: tool_used
    name: selected-shipping-pr
    tool: Skill
    input_match: shipping-pr
    min: 1
  - type: tool_used
    name: no-mutation-tool
    tool: Bash
    min: 0
    max: 0
    arm: both
