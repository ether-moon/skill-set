schema_version: "1.1"
name: shipping-pr-trigger-positive-05
description: Should select shipping-pr for a representative request
tags:
  - shipping-pr
  - trigger-positive
execution:
  prompt: "Run /pr:ship with the existing flags and stop if the blocker fingerprint makes no progress."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 1
graders:
  - type: tool_used
    name: selected-shipping-pr
    tool: Skill
    input_match: "shipping-pr"
    min: 1
