schema_version: "1.1"
name: creating-skills-trigger-positive-01
description: Should select creating-skills for a representative request
tags:
  - creating-skills
  - trigger-positive
execution:
  prompt: "I have skill-creator installed. Create a new agent skill for incident triage, including trigger cases and functional evals, while preserving the project's policy and final acceptance gate."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 1
graders:
  - type: tool_used
    name: selected-creating-skills
    tool: Skill
    input_match: "creating-skills"
    min: 1
