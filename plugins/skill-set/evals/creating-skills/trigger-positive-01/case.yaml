schema_version: "1.1"
name: creating-skills-trigger-positive-01
description: Should select creating-skills for a representative request
tags:
  - creating-skills
  - trigger-positive
execution:
  prompt: "Create a new Claude skill for incident triage, including trigger cases and functional evals."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: selected-creating-skills
    tool: Skill
    input_match: "creating-skills"
    min: 1
  - type: llm
    name: workflow-outcome
    criteria: "Pass only if the response applies the complete skill lifecycle: define use cases and triggers, design the structure and scripts, create representative evaluations, benchmark, and iterate without depending on another authoring skill."
    focus: last_message
