schema_version: "1.1"
name: creating-skills-trigger-positive-04
description: Should select creating-skills for a representative request
tags:
  - creating-skills
  - trigger-positive
execution:
  prompt: "Design positive and negative trigger cases for my deployment skill."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: selected-creating-skills
    tool: Skill
    input_match: "creating-skills"
    min: 1
  - type: llm
    name: workflow-outcome
    criteria: "Pass only if the response treats creating-skills as the primary entry point, establishes project policy and acceptance criteria, delegates the complete supported authoring and evaluation loop to skill-creator when available, retains final acceptance, and completes the same lifecycle locally when the creator is unavailable."
    focus: last_message
