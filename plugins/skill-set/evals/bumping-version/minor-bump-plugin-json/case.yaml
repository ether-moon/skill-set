schema_version: "1.1"
name: bumping-version-minor-bump-plugin-json
description: Migrated functional evaluation for bumping-version
tags:
  - bumping-version
  - functional
  - migrated
context:
  scaffold_script: fixtures/scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools:
    - Skill
    - Read
    - Write
    - Edit
    - Bash
runs: 3
graders:
  - type: file_exists
    name: manifest-created
    path: outputs/.claude-plugin/plugin.json
  - type: regex
    name: manifest-version
    target:
      source: file
      path: outputs/.claude-plugin/plugin.json
    pattern: '"version"\\s*:\\s*"1\\.6\\.0"'
  - type: regex
    name: changelog-heading
    target:
      source: file
      path: outputs/CHANGELOG.md
    pattern: '^## \\[1\\.6\\.0\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$'
    flags: m
  - type: regex
    name: added-section
    target:
      source: file
      path: outputs/CHANGELOG.md
    pattern: '^### Added$'
    flags: m
  - type: regex
    name: fixed-section
    target:
      source: file
      path: outputs/CHANGELOG.md
    pattern: '^### Fixed$'
    flags: m
