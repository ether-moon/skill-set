schema_version: "1.1"
name: bumping-version-trigger-negative-01
description: Should not select bumping-version for a near-miss request
tags:
  - bumping-version
  - trigger-negative
execution:
  prompt: "Update the lodash dependency to its newest compatible version."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: did-not-select-bumping-version
    tool: Skill
    input_match: "bumping-version"
    min: 0
    max: 0
    arm: both
  - type: llm
    name: appropriate-scope
    criteria: "Pass only if the response does not invoke or recommend bumping-version and instead handles the request directly or identifies a more appropriate workflow without forcing it into this skill's scope."
    focus: last_message
