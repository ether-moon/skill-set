schema_version: "1.1"
name: bumping-version-trigger-negative-05
description: Should not select bumping-version for a near-miss request
tags:
  - bumping-version
  - trigger-negative
execution:
  prompt: "Explain how semantic versioning distinguishes major and minor releases."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 1
graders:
  - type: tool_used
    name: did-not-select-bumping-version
    tool: Skill
    input_match: "bumping-version"
    min: 0
    max: 0
    arm: both
