schema_version: "1.1"
name: bumping-version-trigger-positive-07
description: Should select bumping-version for a representative request
tags:
  - bumping-version
  - trigger-positive
execution:
  prompt: "The release push was rejected by branch protection; report the preserved recovery state without opening a PR."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 1
graders:
  - type: tool_used
    name: selected-bumping-version
    tool: Skill
    input_match: "bumping-version"
    min: 1
