schema_version: "1.1"
name: reviewing-with-peer-agents-trigger-negative-06
description: Should not select reviewing-with-peer-agents for a near-miss request
tags:
  - reviewing-with-peer-agents
  - trigger-negative
execution:
  prompt: "Ask a human teammate to review this pull request."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 1
graders:
  - type: tool_used
    name: did-not-select-reviewing-with-peer-agents
    tool: Skill
    input_match: "reviewing-with-peer-agents"
    min: 0
    max: 0
    arm: both
