schema_version: "1.1"
name: autofixing-and-escalating-trigger-positive-06
description: Should select autofixing-and-escalating for a representative request
tags:
  - autofixing-and-escalating
  - trigger-positive
execution:
  prompt: "Fix the obvious issues in these PR review comments; record ambiguous design suggestions for my decision and do not publish anything."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: selected-autofixing-and-escalating
    tool: Skill
    input_match: "autofixing-and-escalating"
    min: 1
  - type: llm
    name: workflow-outcome
    criteria: "Pass only if the response classifies the external findings, fixes only unambiguous items when resolution was explicitly authorized, and escalates judgment-dependent items without publishing or orchestrating follow-up work."
    focus: last_message
