schema_version: "1.1"
name: autofixing-and-escalating-mixed-pr-review-comments
description: Migrated functional evaluation for autofixing-and-escalating
tags:
  - autofixing-and-escalating
  - functional
  - migrated
context:
  scaffold_script: fixtures/scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools:
    - Skill
    - Read
    - Write
    - Edit
    - Bash
runs: 3
graders:
  - type: file_exists
    name: escalation-created
    path: outputs/escalation.md
  - type: regex
    name: null-check-added
    target:
      source: file
      path: outputs/src/auth.js
    pattern: "(if\\s*\\(\\s*!user|user\\s*==={0,1}\\s*(null|undefined)|user\\s*==\\s*null)"
  - type: regex
    name: strategy-refactor-not-applied
    target:
      source: file
      path: outputs/src/auth.js
    pattern: "[Ss]trategy"
    match: not_contains
