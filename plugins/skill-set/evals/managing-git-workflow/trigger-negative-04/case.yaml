schema_version: "1.1"
name: managing-git-workflow-trigger-negative-04
description: Should not select managing-git-workflow for a near-miss request
tags:
  - managing-git-workflow
  - trigger-negative
execution:
  prompt: "Explain what the latest three commits changed without mutating Git."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: did-not-select-managing-git-workflow
    tool: Skill
    input_match: "managing-git-workflow"
    min: 0
    max: 0
    arm: both
  - type: llm
    name: appropriate-scope
    criteria: "Pass only if the response does not invoke or recommend managing-git-workflow and instead handles the request directly or identifies a more appropriate workflow without forcing it into this skill's scope."
    focus: last_message
