schema_version: "1.1"
name: managing-git-workflow-pr-title-and-body-generation
description: Migrated functional evaluation for managing-git-workflow
tags:
  - managing-git-workflow
  - functional
  - migrated
context:
  scaffold_script: fixtures/setup.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools:
    - Skill
    - Read
    - Write
    - Edit
    - Bash
runs: 3
graders:
  - type: file_exists
    name: title-created
    path: outputs/pr-title.txt
  - type: file_exists
    name: body-created
    path: outputs/pr-body.md
  - type: regex
    name: conventional-title
    target:
      source: file
      path: outputs/pr-title.txt
    pattern: '^(?=.{1,70}$)(feat|fix|chore|docs|refactor|test|style|perf|ci|build)(\\(.+\\))?: .+$'
    flags: m
  - type: regex
    name: structured-body
    target:
      source: file
      path: outputs/pr-body.md
    pattern: '^##? Summary[\\s\\S]*^##? (Test Plan|Testing|How to Test)[\\s\\S]*^- \\[ \\]'
    flags: im
  - type: regex
    name: ticket-present
    target:
      source: file
      path: outputs/pr-body.md
    pattern: "PROJ-123"
  - type: tool_used
    name: no-pr-publication
    tool: Bash
    input_match: '(git\s+push|gh\s+pr\s+create)'
    min: 0
    max: 0
    arm: both
