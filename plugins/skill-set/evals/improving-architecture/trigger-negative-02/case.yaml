schema_version: "1.1"
name: improving-architecture-trigger-negative-02
description: Should not select improving-architecture for a near-miss request
tags:
  - improving-architecture
  - trigger-negative
execution:
  prompt: "Implement the chosen refactor candidate now."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools:
    - Skill
runs: 3
graders:
  - type: tool_used
    name: did-not-select-improving-architecture
    tool: Skill
    input_match: "improving-architecture"
    min: 0
    max: 0
    arm: both
  - type: llm
    name: appropriate-scope
    criteria: "Pass only if the response does not invoke or recommend improving-architecture and instead handles the request directly or identifies a more appropriate workflow without forcing it into this skill's scope."
    focus: last_message
