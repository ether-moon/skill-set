schema_version: "1.1"
name: improving-architecture-shallow-validators-cluster
description: Migrated functional evaluation for improving-architecture
tags:
  - improving-architecture
  - functional
  - migrated
context:
  scaffold_script: fixtures/scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools:
    - Skill
    - Read
    - Write
    - Edit
    - Bash
runs: 3
graders:
  - type: file_exists
    name: candidates-created
    path: outputs/candidates.md
  - type: regex
    name: required-fields
    target:
      source: file
      path: outputs/candidates.md
    pattern: "Files:[\\s\\S]*Problem:[\\s\\S]*(Proposed seam|Solution):[\\s\\S]*Locality gain:[\\s\\S]*Leverage gain:[\\s\\S]*Test impact:"
    flags: i
  - type: tool_used
    name: no-grilling-handoff
    tool: Skill
    input_match: "grilling-plans"
    min: 0
    max: 0
    arm: both
